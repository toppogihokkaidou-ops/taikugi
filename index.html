<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>たいくぎドットコム</title>
</head>

<body>
    <h1>たいくぎドットコム</h1>
    <p>たいくぎドットコムは、体操服の情報をまとめたサイトです。体操服の型番や販売店に関する情報をまとめることを主眼としており、性的なコンテンツではありません。着用の画像などもありません。法律に抵触しない範囲かつ人様に迷惑をかけない範囲で、あくまで趣味として楽しむことを目的としています。</p>
    <p>パスワードを入力</p>
    <input type="password" id="pw">
    <button onclick="login()">ログイン</button>

    <script>
        function login() {
            if (document.getElementById("pw").value === "taisofukulove") {
                location.href = "home.html";
            } else {
                alert("パスワードが違います");
            }
        }
    </script>
</body>

</html>
